cidade?","options":[{"en":"No, it is a maximum; travel more slowly when necessary","pt":"Não; é o máximo, e deve-se reduzir quando necessário"},{"en":"Yes, always","pt":"Sim, sempre"},{"en":"Yes, unless it is raining","pt":"Sim, exceto quando chove"},{"en":"Only if other drivers are nearby","pt":"Somente se houver outros motoristas"}],"correct":0,"why":"A velocidade segura depende da estrada, da visibilidade e do trânsito.","source":"rule"},{"id":"BW020","topic":"signs","en":"What does a triangular road sign with a red border normally warn of?","pt":"O que uma placa triangular com borda vermelha normalmente anuncia?","options":[{"en":"A hazard ahead","pt":"Um perigo à frente"},{"en":"Mandatory parking","pt":"Estacionamento obrigatório"},{"en":"A motorway service area","pt":"Área de serviço de motorway"},{"en":"End of all restrictions","pt":"Fim de todas as restrições"}],"correct":0,"why":"Placas triangulares de borda vermelha normalmente alertam sobre riscos.","source":"lights"},{"id":"BW021","topic":"signs","en":"What does a STOP sign require you to do?","pt":"O que uma placa STOP exige que você faça?","options":[{"en":"Come to a complete stop and yield as necessary","pt":"Parar completamente e ceder a passagem quando necessário"},{"en":"Only slow down if the road is clear","pt":"Apenas reduzir se a pista estiver livre"},{"en":"Stop only if another driver signals","pt":"Parar só se outro motorista sinalizar"},{"en":"Continue if you are turning left","pt":"Continuar se for virar à esquerda"}],"correct":0,"why":"STOP exige parada total antes de prosseguir com segurança.","source":"lights"},{"id":"BW022","topic":"signs","en":"What does a GIVE WAY sign mean?","pt":"O que significa a placa GIVE WAY?","options":[{"en":"Give priority to traffic on the road you are entering","pt":"Ceder preferência ao tráfego da via em que vai entrar"},{"en":"You have absolute priority","pt":"Você tem preferência absoluta"},{"en":"You must stop for five minutes","pt":"Você deve parar por cinco minutos"},{"en":"No pedestrians are allowed","pt":"Pedestres são proibidos"}],"correct":0,"why":"A placa determina ceder passagem, parando se necessário.","source":"lights"},{"id":"BW023","topic":"signs","en":"What does a red traffic light mean?","pt":"O que significa um semáforo vermelho?","options":[{"en":"Stop","pt":"Pare"},{"en":"Proceed if the road appears clear","pt":"Avance se a pista parecer livre"},{"en":"Speed up","pt":"Acelere"},{"en":"Give way only to buses","pt":"Dê passagem apenas a ônibus"}],"correct":0,"why":"A luz vermelha determina parada.","source":"lights"},{"id":"BW024","topic":"signs","en":"What does a steady amber traffic light normally mean?","pt":"O que normalmente significa uma luz âmbar fixa no semáforo?","options":[{"en":"Stop unless you are too close to stop safely","pt":"Pare, salvo se estiver perto demais para parar em segurança"},{"en":"Accelerate to clear the junction","pt":"Acelere para liberar o cruzamento"},{"en":"Go as though it were green","pt":"Avance como se fosse verde"},{"en":"Reverse away from the junction","pt":"Dê marcha à ré para afastar-se do cruzamento"}],"correct":0,"why":"A luz âmbar fixa pede parada, exceto se isso já não puder ser feito com segurança.","source":"lights"},{"id":"BW025","topic":"signs","en":"When a traffic light turns green, what should you still check?","pt":"Quando o sinal fica verde, o que você ainda precisa conferir?","options":[{"en":"The junction is clear and it is safe to proceed","pt":"Se o cruzamento está livre e é seguro avançar"},{"en":"Only the speedometer","pt":"Apenas o velocímetro"},{"en":"Whether you can use the horn","pt":"Se pode buzinar"},{"en":"Whether all other vehicles have stopped their engines","pt":"Se todos os outros veículos desligaram o motor"}],"correct":0,"why":"Verde não dispensa observação de pedestres, ciclistas e veículos ainda no cruzamento.","source":"lights"},{"id":"BW026","topic":"signs","en":"What does a NO ENTRY sign indicate?","pt":"O que indica a placa NO ENTRY?","options":[{"en":"You must not enter the road from this direction","pt":"É proibido entrar por esse sentido"},{"en":"Parking is free","pt":"O estacionamento é gratuito"},{"en":"The road is one-way in your direction","pt":"A via é de mão única em seu sentido"},{"en":"You must enter slowly","pt":"É obrigatório entrar lentamente"}],"correct":0,"why":"O sinal proíbe a entrada a partir daquele sentido.","source":"lights"},{"id":"BW027","topic":"signs","en":"What does a solid white line in the centre of the road normally tell you?","pt":"O que uma linha branca contínua no centro da estrada normalmente informa?","options":[{"en":"Do not cross it except where permitted by the rules","pt":"Não cruzá-la, salvo exceções permitidas nas regras"},{"en":"It is a lane for parking","pt":"É uma faixa para estacionar"},{"en":"You must overtake","pt":"Você deve ultrapassar"},{"en":"It marks a bus stop","pt":"Ela demarca um ponto de ônibus"}],"correct":0,"why":"Linhas centrais contínuas restringem cruzamentos e ultrapassagens.","source":"rule"},{"id":"BW028","topic":"signs","en":"What should you do when a school warden shows a stop sign?","pt":"O que fazer quando um agente de travessia escolar exibe sinal de parada?","options":[{"en":"Stop and allow people to cross safely","pt":"Parar e permitir a travessia com segurança"},{"en":"Ignore the signal outside school hours","pt":"Ignorar o sinal fora do horário escolar"},{"en":"Drive around the warden","pt":"Contornar o agente com o carro"},{"en":"Only stop if a traffic light is red","pt":"Parar apenas se o semáforo estiver vermelho"}],"correct":0,"why":"Respeitar os agentes escolares protege as crianças na travessia.","source":"rule"},{"id":"BW029","topic":"signs","en":"What is a red-bordered circular speed limit sign for?","pt":"Para que serve uma placa circular de velocidade com borda vermelha?","options":[{"en":"To show the maximum permitted speed","pt":"Mostrar a velocidade máxima permitida"},{"en":"To show the recommended gear","pt":"Mostrar a marcha recomendada"},{"en":"To show the distance to Dublin","pt":"Mostrar a distância até Dublin"},{"en":"To indicate a minimum following gap in metres","pt":"Indicar a distância mínima em metros para o carro da frente"}],"correct":0,"why":"Não confunda limite legal com velocidade segura para qualquer situação.","source":"lights"},{"id":"BW030","topic":"signs","en":"What does a flashing amber light at a pelican crossing mean for drivers?","pt":"O que significa a luz âmbar piscando numa travessia tipo pelican para os motoristas?","options":[{"en":"Give way to pedestrians still on the crossing; proceed only when clear","pt":"Dar preferência aos pedestres ainda na travessia; avançar só quando estiver livre"},{"en":"Pedestrians are no longer allowed to cross at all","pt":"Pedestres não podem mais atravessar em hipótese alguma"},{"en":"Accelerate immediately","pt":"Acelerar imediatamente"},{"en":"The crossing is closed to everyone","pt":"A travessia está fechada para todos"}],"correct":0,"why":"Na fase âmbar piscante, os pedestres que ainda atravessam mantêm a prioridade.","source":"lights"},{"id":"BW031","topic":"junctions","en":"When approaching a roundabout, to which traffic must you normally give way?","pt":"Ao se aproximar de uma rotatória, a que tráfego você normalmente deve dar preferência?","options":[{"en":"Traffic already on the roundabout, approaching from your right","pt":"Ao tráfego que já circula na rotatória, vindo da direita"},{"en":"Traffic approaching from your left only","pt":"Somente ao tráfego vindo da esquerda"},{"en":"Only buses and trucks","pt":"Somente aos ônibus e caminhões"},{"en":"No traffic if you signal","pt":"A nenhum veículo se você sinalizar"}],"correct":0,"why":"Nas rotatórias irlandesas você normalmente cede passagem a quem já está nelas, vindo da direita, salvo sinais em contrário.","source":"rule"},{"id":"BW032","topic":"junctions","en":"If you intend to take the first exit left at a roundabout, what signal is normally appropriate?","pt":"Se pretende pegar a primeira saída à esquerda na rotatória, qual sinalização é normalmente apropriada?","options":[{"en":"Signal left on approach and until you leave","pt":"Sinalizar à esquerda na aproximação e até sair"},{"en":"Signal right throughout","pt":"Sinalizar à direita o tempo todo"},{"en":"Use hazard lights","pt":"Ligar o pisca-alerta"},{"en":"Never use indicators at a roundabout","pt":"Nunca usar as setas na rotatória"}],"correct":0,"why":"A primeira saída à esquerda normalmente exige seta à esquerda desde a aproximação.","source":"rule"},{"id":"BW033","topic":"junctions","en":"For a later exit beyond straight ahead at a roundabout, which approach lane is normally used unless markings say otherwise?","pt":"Para uma saída depois da direção em frente numa rotatória, qual faixa é normalmente usada na aproximação, salvo marcações diferentes?","options":[{"en":"The right-hand lane","pt":"A faixa da direita"},{"en":"The left-hand lane only","pt":"Somente a faixa da esquerda"},{"en":"The hard shoulder","pt":"O acostamento"},{"en":"Any lane without checking markings","pt":"Qualquer faixa sem verificar marcações"}],"correct":0,"why":"Para saídas após a posição de 12 horas, em regra usa-se a faixa direita, salvo indicação diferente da via.","source":"rule"},{"id":"BW034","topic":"junctions","en":"When leaving a roundabout, when should you normally signal left?","pt":"Ao sair de uma rotatória, quando normalmente deve sinalizar à esquerda?","options":[{"en":"After passing the exit before the one you want","pt":"Após passar pela saída anterior à desejada"},{"en":"Only after you have left the roundabout","pt":"Somente depois que sair"},{"en":"Before entering, even if going right","pt":"Antes de entrar, mesmo se for sair à direita"},{"en":"Only when another driver flashes headlights","pt":"Somente quando outro motorista pisca o farol"}],"correct":0,"why":"A seta à esquerda antes da saída informa sua intenção sem criar confusão.","source":"rule"},{"id":"BW035","topic":"junctions","en":"At a junction with a STOP sign and a clear road, what must you do?","pt":"Num cruzamento com placa STOP e pista livre, o que é obrigatório fazer?","options":[{"en":"Stop completely before entering","pt":"Parar completamente antes de entrar"},{"en":"Continue without stopping if you can see well","pt":"Continuar sem parar se houver boa visibilidade"},{"en":"Only tap the brakes","pt":"Apenas tocar no freio"},{"en":"Give way only to cyclists","pt":"Ceder passagem apenas aos ciclistas"}],"correct":0,"why":"A sinalização de STOP não deixa de valer porque não há trânsito aparente.","source":"rule"},{"id":"BW036","topic":"junctions","en":"If a vehicle is already in the lane you want to enter, who has priority?","pt":"Se já existe um veículo na faixa para a qual você quer entrar, quem tem preferência?","options":[{"en":"The vehicle already in that lane","pt":"O veículo que já está naquela faixa"},{"en":"You, if your indicator is on","pt":"Você, se estiver com a seta ligada"},{"en":"Whichever vehicle is larger","pt":"O veículo maior"},{"en":"The faster vehicle","pt":"O veículo mais rápido"}],"correct":0,"why":"Sinalizar informa uma manobra; não transfere a preferência.","source":"rule"},{"id":"BW037","topic":"junctions","en":"When emerging from a private driveway, what should you do?","pt":"Ao sair de uma garagem privada para a rua, o que fazer?","options":[{"en":"Give way to road users and pedestrians and enter only when safe","pt":"Dar passagem aos usuários da via e pedestres e entrar só quando for seguro"},{"en":"Drive straight out because you own the property","pt":"Sair diretamente porque a propriedade é sua"},{"en":"Reverse quickly into the traffic","pt":"Dar ré rapidamente para o trânsito"},{"en":"Sound the horn to claim priority","pt":"Buzinar para obter preferência"}],"correct":0,"why":"A saída de propriedade não concede prioridade ao veículo que ingressa na via.","source":"rule"},{"id":"BW038","topic":"junctions","en":"At a junction with restricted visibility, what is the safest approach?","pt":"Num cruzamento com visibilidade limitada, qual é a conduta mais segura?","options":[{"en":"Approach slowly, look carefully and be ready to stop","pt":"Aproximar-se devagar, observar e preparar-se para parar"},{"en":"Increase speed to pass quickly","pt":"Aumentar a velocidade para passar rápido"},{"en":"Assume all other vehicles will stop","pt":"Presumir que os demais irão parar"},{"en":"Use full beam to force others to yield","pt":"Usar farol alto para forçar preferência"}],"correct":0,"why":"Sem visibilidade suficiente, é preciso reduzir o risco e ganhar tempo para reagir.","source":"rule"},{"id":"BW039","topic":"junctions","en":"If road arrows indicate a mandatory turning lane, what should you do?","pt":"Se as setas no pavimento indicam uma faixa de conversão obrigatória, o que fazer?","options":[{"en":"Follow the lane direction or change lanes only when legal and safe","pt":"Seguir a direção da faixa ou mudar de faixa somente de forma legal e segura"},{"en":"Ignore arrows if you know a shortcut","pt":"Ignorar as setas se conhecer um atalho"},{"en":"Stop at the arrow and reverse","pt":"Parar na seta e dar ré"},{"en":"Drive across any solid line","pt":"Cruzar qualquer linha contínua"}],"correct":0,"why":"A escolha da faixa deve respeitar setas e marcações.","source":"rule"},{"id":"BW040","topic":"junctions","en":"When approaching a roundabout where lane signs differ from the general rule, what should you follow?","pt":"Ao se aproximar de uma rotatória onde as placas de faixa diferem da regra geral, o que seguir?","options":[{"en":"The actual lane signs and road markings","pt":"As placas de faixa e as marcações reais da via"},{"en":"Only the usual left-lane rule","pt":"Apenas a regra usual de faixa esquerda"},{"en":"The route taken by the biggest vehicle","pt":"O caminho do maior veículo"},{"en":"Always the right-hand lane","pt":"Sempre a faixa direita"}],"correct":0,"why":"A sinalização específica da rotatória prevalece sobre orientações gerais de posicionamento.","source":"rule"},{"id":"BW041","topic":"manoeuvres","en":"Before changing lanes, what checks should you make?","pt":"Antes de mudar de faixa, quais verificações fazer?","options":[{"en":"Mirrors, blind spot, signal and a final safety check","pt":"Espelhos, ponto cego, seta e conferência final"},{"en":"Only the speedometer","pt":"Apenas o velocímetro"},{"en":"Only the rear-view camera","pt":"Apenas a câmera de ré"},{"en":"Only the traffic ahead","pt":"Apenas o trânsito à frente"}],"correct":0,"why":"Pontos cegos podem esconder motos e ciclistas, mesmo após olhar os espelhos.","source":"rule"},{"id":"BW042","topic":"manoeuvres","en":"Does using an indicator give you priority when changing lanes?","pt":"Usar a seta dá preferência quando você muda de faixa?","options":[{"en":"No, you must still wait for a safe gap","pt":"Não, você ainda deve esperar uma abertura segura"},{"en":"Yes, always","pt":"Sim, sempre"},{"en":"Yes, if the indicator has been on for five seconds","pt":"Sim, se a seta estiver ligada há cinco segundos"},{"en":"Only on motorways","pt":"Somente nas motorways"}],"correct":0,"why":"O pisca informa intenção, mas não obriga os demais a ceder passagem.","source":"rule"},{"id":"BW043","topic":"manoeuvres","en":"When is overtaking unsafe?","pt":"Quando uma ultrapassagem é insegura?","options":[{"en":"When you cannot see enough clear road ahead","pt":"Quando não é possível enxergar um trecho livre suficiente à frente"},{"en":"When road markings permit it and visibility is good","pt":"Quando a marcação permite e há boa visibilidade"},{"en":"When the vehicle ahead is much slower","pt":"Quando o veículo da frente está muito mais lento"},{"en":"When you can return to the lane safely","pt":"Quando consegue retornar à faixa com segurança"}],"correct":0,"why":"Não ultrapasse perto de curvas ou lombadas cegas sem visibilidade suficiente.","source":"rule"},{"id":"BW044","topic":"manoeuvres","en":"Which side is generally used when overtaking slower traffic on an ordinary road in Ireland?","pt":"Por qual lado, em geral, se ultrapassa um veículo mais lento numa via comum da Irlanda?","options":[{"en":"On the right","pt":"Pela direita"},{"en":"On the left","pt":"Pela esquerda"},{"en":"On the hard shoulder","pt":"Pelo acostamento"},{"en":"On either side without checking","pt":"Por qualquer lado sem conferir"}],"correct":0,"why":"Na circulação pela esquerda, a ultrapassagem normalmente é feita pela direita, com exceções específicas.","source":"rule"},{"id":"BW045","topic":"manoeuvres","en":"What should you do before turning right across oncoming traffic?","pt":"O que fazer antes de virar à direita cruzando o tráfego contrário?","options":[{"en":"Wait for a safe gap and give way as required","pt":"Esperar uma abertura segura e ceder passagem quando necessário"},{"en":"Assume your indicator gives you priority","pt":"Achar que a seta dá preferência"},{"en":"Cut across immediately","pt":"Cortar a via imediatamente"},{"en":"Drive onto the opposite kerb","pt":"Subir no meio-fio oposto"}],"correct":0,"why":"A conversão à direita pode cruzar a trajetória de veículos que vêm no sentido contrário.","source":"rule"},{"id":"BW046","topic":"manoeuvres","en":"What should you do if you miss your turn?","pt":"O que fazer se perder a entrada desejada?","options":[{"en":"Continue safely and find a legal place to turn later","pt":"Continuar com segurança e procurar um lugar legal para retornar"},{"en":"Reverse along the road to the junction","pt":"Dar ré pela estrada até a entrada"},{"en":"Make a sudden turn without checking","pt":"Virar de repente sem conferir"},{"en":"Stop in the lane to consult the map","pt":"Parar na faixa para consultar o mapa"}],"correct":0,"why":"É melhor corrigir o percurso com segurança do que executar uma manobra brusca.","source":"rule"},{"id":"BW047","topic":"manoeuvres","en":"Why check your blind spot before pulling away?","pt":"Por que verificar o ponto vulnerable","en":"What lateral space does the RSA recommend when passing a cyclist in a zone of 50 km/h or below?","pt":"Qual espaço lateral a RSA recomenda ao ultrapassar ciclista em zona de até 50 km/h?","options":[{"en":"At least 1 metre","pt":"Pelo menos 1 metro"},{"en":"20 centimetres","pt":"20 centímetros"},{"en":"Half a metre at most","pt":"No máximo meio metro"},{"en":"No lateral gap if you slow down","pt":"Nenhuma distância lateral se reduzir"}],"correct":0,"why":"A RSA orienta deixar no mínimo 1 metro em zonas de até 50 km/h.","source":"cyclists"},{"id":"BW051","topic":"vulnerable","en":"What lateral space does the RSA recommend when overtaking cyclists where the speed limit exceeds 50 km/h?","pt":"Qual espaço lateral a RSA recomenda ao ultrapassar ciclistas onde o limite ultrapassa 50 km/h?","options":[{"en":"At least 1.5 metres","pt":"Pelo menos 1,5 metro"},{"en":"Exactly 30 centimetres","pt":"Exatamente 30 centímetros"},{"en":"Only one tyre's width","pt":"Somente a largura de um pneu"},{"en":"No space if you sound the horn","pt":"Nenhum espaço se buzinar"}],"correct":0,"why":"Em zonas acima de 50 km/h, a orientação da RSA é deixar ao menos 1,5 metro.","source":"cyclists"},{"id":"BW052","topic":"vulnerable","en":"What should you do when you cannot pass a cyclist with enough space?","pt":"O que fazer quando não é possível ultrapassar um ciclista com espaço suficiente?","options":[{"en":"Wait behind until it is safe","pt":"Esperar atrás até ser seguro"},{"en":"Squeeze past carefully","pt":"Passar bem apertado com cuidado"},{"en":"Sound the horn repeatedly and pass","pt":"Buzinar várias vezes e passar"},{"en":"Move onto the footpath to overtake","pt":"Subir na calçada para ultrapassar"}],"correct":0,"why":"Não force a passagem; ciclistas podem desviar de buracos e sofrer rajadas de vento.","source":"cyclists"},{"id":"BW053","topic":"vulnerable","en":"Before opening a parked car door next to traffic, what should you check?","pt":"Antes de abrir a porta de um carro estacionado, o que verificar?","options":[{"en":"Look for approaching cyclists and other road users","pt":"Procurar ciclistas e demais usuários se aproximando"},{"en":"Only the car radio","pt":"Somente o rádio do carro"},{"en":"Whether the engine is warm","pt":"Se o motor está quente"},{"en":"Whether pedestrians are looking at you","pt":"Se os pedestres estão olhando para você"}],"correct":0,"why":"Abrir a porta sem observar pode atingir quem circula ao lado do veículo.","source":"cyclists"},{"id":"BW054","topic":"vulnerable","en":"When approaching children near a school, what should you expect?","pt":"Ao se aproximar de crianças perto de uma escola, o que você deve prever?","options":[{"en":"They may enter the road unexpectedly","pt":"Elas podem entrar na via inesperadamente"},{"en":"They will always wait until no vehicles are near","pt":"Elas sempre esperarão não haver carros"},{"en":"They cannot cross except at lights","pt":"Elas não podem atravessar fora de semáforos"},{"en":"They will all be visible from far away","pt":"Todas estarão visíveis de longe"}],"correct":0,"why":"Crianças podem agir de forma imprevisível; reduza e esteja preparado para parar.","source":"rule"},{"id":"BW055","topic":"vulnerable","en":"What should you do if a pedestrian is already crossing a zebra crossing?","pt":"O que fazer se um pedestre já está atravessando uma faixa de pedestres (zebra crossing)?","options":[{"en":"Stop and let the pedestrian cross safely","pt":"Parar e permitir que atravesse com segurança"},{"en":"Accelerate before the pedestrian reaches your lane","pt":"Acelerar antes que alcance sua faixa"},{"en":"Sound the horn and continue","pt":"Buzinar e continuar"},{"en":"Overtake the vehicle that stopped for the pedestrian","pt":"Ultrapassar o veículo que parou para o pedestre"}],"correct":0,"why":"A segurança e a preferência do pedestre na faixa devem ser respeitadas.","source":"rule"},{"id":"BW056","topic":"vulnerable","en":"Why is extra care needed near horses on ped bus?","pt":"O que é especialmente importante ao passar por um ônibus parado?","options":[{"en":"Watch for pedestrians entering the road from around it","pt":"Observar pedestres que possam surgir ao redor dele"},{"en":"Assume there are no people nearby","pt":"Presumir que não há pessoas"},{"en":"Always pass at the speed limit","pt":"Passar sempre no limite máximo"},{"en":"Ignore the near-side kerb","pt":"Ignorar o meio-fio próximo"}],"correct":0,"why":"O ônibus pode ocultar pessoas que iniciam uma travessia.","source":"rule"},{"id":"BW060","topic":"safety","en":"How should you respond to feeling sleepy while driving?","pt":"Como agir se estiver com sono ao dirigir?","options":[{"en":"Stop somewhere safe and rest before continuing","pt":"Parar em local seguro e descansar antes de continuar"},{"en":"Open a window and rely on cold air","pt":"Abrir a janela e confiar no vento frio"},{"en":"Turn the radio up and drive faster","pt":"Aumentar o rádio e acelerar"},{"en":"Drink water and ignore the fatigue","pt":"Beber água e ignorar o cansaço"}],"correct":0,"why":"Sono e fadiga prejudicam reação e julgamento; não confie em truques para continuar.","source":"rule"},{"id":"BW061","topic":"safety","en":"Why should you increase the gap to the vehicle ahead in rain?","pt":"Por que aumentar a distância para o veículo da frente quando chove?","options":[{"en":"Stopping distances may become longer","pt":"A distância de frenagem pode aumentar"},{"en":"Road markings no longer apply","pt":"As faixas deixam de valer"},{"en":"The car ahead has priority over all roads","pt":"O carro da frente passa a ter prioridade em todas as vias"},{"en":"Tyres grip better in standing water","pt":"Pneus aderem melhor em água acumulada"}],"correct":0,"why":"Pista molhada reduz aderência e pode prolongar a frenagem.","source":"rule"},{"id":"BW062","topic":"safety","en":"What should you do if you encounter black ice?","pt":"O que fazer ao encontrar gelo quase invisível (black ice)?","options":[{"en":"Reduce speed gently and avoid sudden steering or braking","pt":"Reduzir suavemente e evitar guinadas ou frenagens bruscas"},{"en":"Brake hard immediately","pt":"Frear com força imediatamente"},{"en":"Accelerate sharply","pt":"Acelerar bruscamente"},{"en":"Use the handbrake to turn","pt":"Usar o freio de mão para fazer a curva"}],"correct":0,"why":"Gelo reduz drasticamente a aderência; movimentos suaves são mais seguros.","source":"rule"},{"id":"BW063","topic":"safety","en":"When visibility is poor because of fog, what should you do?","pt":"Quando a visibilidade está ruim por nevoeiro, o que fazer?","options":[{"en":"Reduce speed and use suitable lights","pt":"Reduzir a velocidade e usar luzes adequadas"},{"en":"Always use full beam continuously","pt":"Usar farol alto continuamente em todas as situações"},{"en":"Switch off all lights","pt":"Desligar todas as luzes"},{"en":"Follow very closely behind another car","pt":"Seguir bem colado em outro carro"}],"correct":0,"why":"Adequar velocidade e iluminação evita colisões em baixa visibilidade.","source":"rule"},{"id":"BW064","topic":"safety","en":"Why should you avoid driving through deep standing water?","pt":"Por que evitar atravessar água acumulada profunda?","options":[{"en":"It may hide hazards and affect brakes or vehicle control","pt":"Pode esconder perigos e afetar freios ou controle do carro"},{"en":"Water always improves traction","pt":"Água sempre melhora a aderência"},{"en":"Road signs are suspended in floods","pt":"A sinalização fica suspensa em enchentes"},{"en":"The engine cannot be damaged by water","pt":"Água não pode danificar o motor"}],"correct":0,"why":"Enchentes escondem a profundidade real e podem causar perda de controle ou danos.","source":"rule"},{"id":"BW065","topic":"safety","en":"What should you do when the sun dazzles you?","pt":"O que fazer quando o sol prejudica sua visão?","options":[{"en":"Slow down and increase your safety margin","pt":"Reduzir a velocidade e aumentar a margem de segurança"},{"en":"Speed up to leave the glare quickly","pt":"Acelerar para sair logo do ofuscamento"},{"en":"Look directly at the sun","pt":"Olhar diretamente para o sol"},{"en":"Move into the oncoming lane","pt":"Invadir a faixa contrária"}],"correct":0,"why":"O ofuscamento reduz a percepção de distância e de perigos.","source":"rule"},{"id":"BW066","topic":"safety","en":"What should you do if another driver is behaving aggressively?","pt":"Como agir se outro motorista está dirigindo agressivamente?","options":[{"en":"Keep a safe distance and avoid confrontation","pt":"Manter distância segura e evitar confronto"},{"en":"Race the driver","pt":"Disputar corrida com ele"},{"en":"Brake sharply to teach a lesson","pt":"Frear bruscamente para dar uma lição"},{"en":"Make threatening gestures","pt":"Fazer gestos ameaçadores"}],"correct":0,"why":"A direção defensiva reduz riscos sem escalar conflitos.","source":"rule"},{"id":"BW067","topic":"safety","en":"What should you do if a curve ahead is blind?","pt":"O que fazer quando a curva à frente não oferece visibilidade?","options":[{"en":"Slow so you can stop within the distance you can see","pt":"Reduzir para conseguir parar dentro do trecho visível"},{"en":"Overtake before entering the curve","pt":"Ultrapassar antes da curva"},{"en":"Keep the same speed regardless of view","pt":"Manter velocidade independentemente da visão"},{"en":"Move to the opposite side of the road","pt":"Passar ao lado contrário da estrada"}],"correct":0,"why":"A capacidade de parar dentro do trecho livre visível é fundamental.","source":"rule"},{"id":"BW068","topic":"safety","en":"What is a key danger of using a handheld phone while driving?","pt":"Qual é um risco central de usar o celular na mão enquanto dirige?","options":[{"en":"Loss of attention and illegal distraction","pt":"Perda de atenção e distração proibida"},{"en":"Improved reaction time","pt":"Melhora do tempo de reação"},{"en":"Better awareness of blind spots","pt":"Melhor percepção dos pontos function qIsWeak(id){let x=stats[id];return !!(x&&x.needsReview)}

function iconName(k){return {basics:'🧭',speed:'⏱️',signs:'🚦',junctions:'🔄',manoeuvres:'↪️',vulnerable:'🚲',safety:'🛡️',learner:'🪪',vehicle:'🚙',motorway:'🛣️',parking:'🅿️',tractor:'🚜',eco:'🌱',emergency:'🚨'}[k]||'📘'}

function readState(){const total=Object.keys(stats).filter(k=>stats[k].tries>0).length;const weak=BANK.filter(q=>qIsWeak(q.id)).length;const exams=history.filter(h=>h.mode==='exam');const best=exams.length?Math.max(...exams.map(x=>x.score)):null;return {total,weak,exams,best}}

function launch(mode,topic='all'){if(mode==='wrong'&&!BANK.some(q=>qIsWeak(q.id))){alert('Você ainda não tem erros pendentes. Faça um estudo ou simulado primeiro.');return}if(mode==='saved'&&!bookmarks.length){alert('Você ainda não salvou perguntas. Toque em “Salvar questão” durante os exercícios.');return}if(mode==='exam'){start(mode,'all',40);return}root(`<section class="panel" style="max-width:720px;margin:30px auto"><button class="btn soft small" onclick="home()">← Início</button><h1 style="margin:22px 0 5px">${safe(modeName(mode))}</h1><p class="sub">${mode==='study'?'Escolha um assunto e a quantidade de questões.':'Selecione quantas perguntas deseja praticar.'}</p>${mode==='study'?`<div class="field"><label for="topicSelect">Assunto</label><select class="select" id="topicSelect"><option value="all">Todos os assuntos (${BANK.length})</option>${Object.keys(TOPICS).map(k=>`<option value="${k}" ${topic===k?'selected':''}>${safe(topicName(k))} (${topicCounts[k]})</option>`).join('')}</select></div>`:''}<div class="field"><label for="lengthSelect">Quantidade</label><select class="select" id="lengthSelect"><option value="10">10 perguntas</option><option value="20" selected>20 perguntas</option><option value="all">Todas as disponíveis</option></select></div><div class="notice">As alternativas aparecem simultaneamente em inglês e português. A explicação vem em português após a resposta.</div><div class="actions"><button class="btn" onclick="start('${mode}',document.getElementById('topicSelect')?.value||'all',document.getElementById('lengthSelect').value)">Iniciar treinamento →</button></div></section>`)}
function start(mode,topic='all',count=20,ids=null){if(session&&!confirm('Substituir a sessão anterior e começar uma nova?'))return;let pool=ids?ids.map(x=>questionById[x]).filter(Boolean):BANK.filter(q=>(topic==='all'||q.topic===topic)&&(mode==='study'||(mode==='wrong'?qIsWeak(q.id):mode==='saved'?bookmarks.includes(q.id):true)));
if(!pool.length){alert('Nenhuma pergunta disponível nesta seleção.');return}
let chosen=shuffle(pool);if(mode==='exam'){// distribute questions across topics before filling the remaining slots
const grouped=Object.keys(TOPICS).map(k=>shuffle(chosen.filter(q=>q.topic===k)));let selected=[];while(selected.length<40&&grouped.some(g=>g.length)){for(const g of grouped){if(g.length&&selected.length<40)selected.push(g.shift())}}chosen=shuffle(selected)}else if(count!=='all'){chosen=chosen.slice(0,Math.min(Number(count)||20,chosen.length))}
session={mode,topic,pos:0,started:Date.now(),deadline:mode==='exam'?Date.now()+45*60*1000:null,items:chosen.map(q=>({id:q.id,order:shuffle([0,1,2,3]),choice:null,flag:false,committed:false}))};save();quiz();}
function resume(){if(!session){home();return}if(session.deadline&&session.deadline<Date.now()){finish(true);return}quiz()}
let timerId=null;
function countdown(){if(!session||!session.deadline){if($('timer'))$('timer').textContent='Sem limite';return}const remaining=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));if($('timer')){$('timer').textContent='⏱ '+String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('timer').classList.toggle('low',remaining<=300)}if(remaining<=0){clearInterval(timerId);finish(true)}}
function quiz(){if(!session)return home();clearInterval(timerId);if(session.deadline&&session.deadline<=Date.now())return finish(true);const step=session.items[session.pos],q=questionById[step.id],study=session.mode!=='exam',hasAnswer=step.choice!==null;
root(`<div class="quiz-shell"><div class="quizbar"><button class="btn soft small" onclick="abandon()">← Sair</button><div class="chip">${safe(modeName(session.mode))}</div><div class="timer" id="timer"></div></div><section class="panel"><div class="row"><span class="q-label">${safe(topicName(q.topic))}</span><span class="tiny">Questão ${session.pos+1} de ${session.items.length}</span></div><div class="progress"><div style="width:${100*(session.pos+1)/session.items.length}%"></div></div><div class="translation"><span class="lang">EN</span><h2 class="q-en" style="margin-top:0">${safe(q.en)}</h2></div><div class="translation" style="margin-top:7px"><span class="lang pt">PT</span><p class="q-pt">${safe(q.pt)}</p></div><div class="toolstrip"><button onclick="speak('en')">🔊 Ouvir inglês</button><button onclick="speak('pt')">🔊 Ouvir português</button><button class="${bookmarks.includes(q.id)?'saved':''}" onclick="toggleBookmark('${q.id}')">${bookmarks.includes(q.id)?'★ Salva':'☆ Salvar questão'}</button>${session.mode==='exam'?`<button class="${step.flag?'saved':''}" onclick="markFlag()">${step.flag?'⚑ Marcada':'⚐ Marcar para revisar'}</button>`:''}</div><div style="margin-top:20px">${step.order.map((optionIndex,visibleIndex)=>{const option=q.options[optionIndex];const selected=step.choice===optionIndex;const isCorrect=optionIndex===q.correct;const cls=study&&hasAnswer?(isCorrect?'correct':selected?'incorrect':''):selected?'selected':'';return `<button class="option ${cls}" ${study&&hasAnswer?'disabled':''} aria-pressed="${selected}" onclick="answer(${optionIndex})"><span class="letter">${'ABCD'[visibleIndex]}</span><span class="option-copy"><strong>${safe(option.en)}</strong><span>${safe(option.pt)}</span></span></button>`}).join('')}</div>${study&&hasAnswer?`<div class="feedback ${step.choice===q.correct?'':'bad'}"><strong>${step.choice===q.correct?'✅ Resposta correta!':'❌ Resposta incorreta'}</strong><p>${safe(q.why)}</p><a target="_blank" rel="noopener noreferrer" href="${safe(SOURCES[q.source][1])}">Consultar fonte: ${safe(SOURCES[q.source][0])} ↗</a></div>`:''}${!study?`<div class="notice">No simulado, a correção só aparece no final. Você pode avançar, voltar ou marcar questões para revisar.</div>`:''}<div class="quiz-footer"><button class="btn soft" onclick="back()" ${session.pos===0?'disabled':''}>← Anterior</button><button class="btn" onclick="next()">${session.pos===session.items.length-1?'Finalizar prova ✓':'Próxima →'}</button></div>${session.mode==='exam'?`<div class="navigator" aria-label="Navegação entre as questões">${session.items.map((it,i)=>`<button class="navdot ${it.choice!==null?'answered':''} ${it.flag?'flagged':''} ${session.pos===i?'current':''}" aria-label="Ir para questão ${i+1}" onclick="jump(${i})">${i+1}</button>`).join('')}</div>`:''}</section></div>`);
countdown();if(session.deadline)timerId=setInterval(countdown,1000)}
function answer(optionIndex){if(!session)return;const step=session.items[session.pos];if(session.mode!=='exam'&&step.committed)return;step.choice=optionIndex;if(session.mode!=='exam'){step.committed=true;recordOne(questionById[step.id],optionIndex)}save();quiz()}
function recordOne(q,choice){let s=stats[q.id]||{tries:0,good:0,misses:0,needsReview:false};s.tries++;if(choice===q.correct){s.good++;s.needsReview=false}else{s.misses++;s.needsReview=true}s.lastAt=Date.now();stats[q.id]=s;save()}
function toggleBookmark(id){bookmarks=bookmarks.includes(id)?bookmarks.filter(x=>x!==id):[...bookmarks,id];save();quiz()}
function markFlag(){session.items[session.pos].flag=!session.items[session.pos].flag;save();quiz()}
function jump(i){if(!session)return;session.pos=Math.max(0,Math.min(i,session.items.length-1));save();quiz()}
function back(){if(session&&session.pos>0){session.pos--;save();quiz()}}
function next(){if(!session)return;if(session.pos<session.items.length-1){session.pos++;save();quiz()}else{if(session.mode==='exam'){let unanswered=session.items.filter(x=>x.choice===null).length;if(unanswered&&!confirm(`Há ${unanswered} questão(ões) sem resposta. Finalizar mesmo assim?`))return}finish(false)}}
function abandon(){if(!session)return home();if(confirm('Sair da sessão? Seu progresso parcial ficará salvo para continuar depois.')){clearInterval(timerId);home()}}
function scoreState(s){return s.items.filter(it=>it.choice===questionById[it.id].correct).length}
function finish(expired=false){if(!session)return home();clearInterval(timerId);const completed=session;const score=scoreState(completed);const misses=completed.items.filter(it=>it.choice!==questionById[it.id].correct);if(completed.mode==='exam'){completed.items.forEach(it=>recordOne(questionById[it.id],it.choice))}const report={timestamp:Date.now(),mode:completed.mode,score,total:completed.items.length,wrong:misses.length,topic:completed.topic,expired,missIds:misses.map(m=>m.id)};history=[report,...history].slice(0,100);session=null;save();showResult(report,completed)}
function showResult(report,original){const pass=report.mode==='exam'&&report.score>=35,percent=Math.round(report.score/report.total*100),wrong=original.items.filter(it=>it.choice!==questionById[it.id].correct);const missedTopic={};for(let it of wrong){const k=questionById[it.id].topic;missedTopic[k]=(missedTopic[k]||0)+1}const topics=Object.entries(missedTopic).sort((a,b)=>b[1]-a[1]);const word=report.mode==='exam'?(pass?'Aprovado no simulado!':'Ainda não atingiu 35 acertos'):'Treino concluído';root(`<div style="max-width:920px;margin:24px auto"><div class="result-hero"><div class="eyebrow">${safe(modeName(report.mode))} · ${report.expired?'Tempo esgotado':'Concluído'}</div><h1>${word}</h1><div class="score">${report.score}/${report.total}</div><p>${percent}% de acertos · ${wrong.length} erros ou não respondidas${report.mode==='exam'?' · nota mínima 35/40':''}</p></div><section class="panel"><div class="row"><div><h2 class="section-title">Seu plano de estudos</h2><p class="sub">Priorize os assuntos em que errou mais e repita as questões ao final.</p></div><span class="tagline">Análise personalizada</span></div>${topics.length?topics.map(([k,n],i)=>`<div class="report-topic"><div class="row"><strong>${i+1}. ${iconName(k)} ${safe(topicName(k))}</strong><span class="chip">${n} ${n===1?'erro':'erros'}</span></div><p class="sub" style="margin:6px 0">${safe(studyAdvice(k))}</p><button class="btn soft small" onclick="start('study','${k}',10)">Treinar este tema →</button></div>`).join(''):'<div class="callout">Excelente! Você não errou nenhuma questão nesta sessão. Continue alternando os temas.</div>'}</section><section class="panel"><h2 class="section-title">Revisão de cada erro (${wrong.length})</h2><p class="sub">Confira seu erro, a resposta correta e o raciocínio para não repetir.</p>${wrong.length?wrong.map((it,i)=>{let q=questionById[it.id];return `<div class="report-card"><div class="tiny">${safe(topicName(q.topic))} · Erro ${i+1}</div><div class="qtext">${safe(q.en)}</div><div class="minor">${safe(q.pt)}</div><p class="minor wrong-answer"><strong>Sua resposta:</strong> ${it.choice===null?'Não respondida':safe(q.options[it.choice].en)+' / '+safe(q.options[it.choice].pt)}</p><p class="minor right-answer"><strong>Resposta correta:</strong> ${safe(q.options[q.correct].en)} / ${safe(q.options[q.correct].pt)}</p><p class="minor"><strong>Entenda a regra:</strong> ${safe(q.why)}</p><a href="${safe(SOURCES[q.source][1])}" target="_blank" rel="noopener noreferrer" style="font-size:12px">Fonte de referência ↗</a></div>`}).join(''):'<div class="callout">Nenhum erro a revisar nesta sessão.</div>'}<div class="actions">${wrong.length?`<button class="btn" onclick='redoErrors(${JSON.stringify(wrong.map(x=>x.id))})'>🔁 Repetir estas ${wrong.length} questões</button>`:''}<button class="btn soft" onclick="home()">Voltar ao início</button><button class="btn ghost" onclick="showHistory()">Meu progresso</button></div></section></div>`)}
function redoErrors(ids){if(!ids.length)return;start('study','all','all',ids)}
function studyAdvice(k){return {
basics:'Revise circulação pela esquerda, observação antes de sair e respeito às instruções da Garda.',
speed:'Reveja os limites gerais e, especialmente, a mudança de 2025 para 60 km/h nas estradas locais rurais.',
signs:'Identifique o significado de STOP, GIVE WAY, semáforos e placas de advertência.',
junctions:'Pratique a preferência em rotatórias, as setas de saída e as marcações que indicam faixa obrigatória.',
manoeuvres:'Revise espelhos, ponto cego, sinalização e ultrapassagem sem forçar passagem.',
vulnerable:'Reforce a segurança de pedestres, ciclistas, crianças e cavalos; atenção aos espaços laterais.',
safety:'Treine decisões sobre chuva, gelo, nevoeiro, sono, visibilidade e direção defensiva.',
learner:'Memorize 40/45/35 e as regras do Learner Permit: placas L, acompanhamento e proibição de motorways.',
vehicle:'Estude pneus, retenção infantil, cintos, freios e inspeções básicas.',
motorway:'Reforce permanência à esquerda, acostamento só em emergência, entradas e saídas seguras.',
parking:'Priorize situações em que o estacionamento impede acessos ou coloca pedestres e ciclistas em risco.',
tractor:'Revise a categoria W, limites de projeto, beacon âmbar, implementos, matrícula e manutenção.',
eco:'Pratique aceleração suave, antecipação do fluxo e manutenção correta dos pneus.',
emergency:'Reveja como parar em segurança, proteger pessoas e acionar ajuda sem criar um novo risco.'}[k]||'Revise o tema com o manual da RSA.'}
function showHistory(){const m=readState();root(`<section class="panel" style="max-width:900px;margin:25px auto"><div class="row"><div><h1 style="margin:0">Seu progresso</h1><p class="sub">Dados salvos apenas neste navegador e neste dispositivo.</p></div><button class="btn soft small" onclick="home()">← Voltar</button></div><div class="statrow" style="margin:20px 0"><div class="stat"><div class="label">Questões já vistas</div><strong>${m.total}</strong></div><div class="stat"><div class="label">Questões para revisar</div><strong>${m.weak}</strong></div><div class="stat"><div class="label">Simulados BW</div><strong>${m.exams.length}</strong></div><div class="stat"><div class="label">Melhor nota</div><strong>${m.best===null?'—':m.best+'/40'}</strong></div></div><h2 class="section-title">Assuntos em revisão</h2>${Object.keys(TOPICS).map(k=>{let n=BANK.filter(q=>q.topic===k&&qIsWeak(q.id)).length;if(!n)return '';return `<div class="history-item"><span>${safe(topicName(k))}</span><strong>${n} pendente(s)</strong></div>`}).join('')||'<p class="sub">Nenhum erro pendente por enquanto.</p>'}<div class="actions"><button class="btn" onclick="launch('wrong')" ${m.weak?'':'disabled'}>Treinar meus erros →</button><button class="btn soft" onclick="exportProgress()">⬇ Exportar progresso</button><button class="btn danger" onclick="resetProgress()">Limpar dados</button></div><h2 class="section-title" style="margin-top:26px">Histórico de sessões</h2>${history.length?history.slice(0,30).map(h=>`<div class="history-item"><span><strong>${safe(modeName(h.mode))}</strong><br><small class="tiny">${new Date(h.timestamp).toLocaleString('pt-BR')}</small></span><strong>${h.score}/${h.total} · ${Math.round(100*h.score/h.total)}%</strong></div>`).join(''):'<p class="empty">Nenhuma sessão concluída ainda.</p>'}</section>`)}
function exportProgress(){const payload=JSON.stringify({version:3,exportedAt:new Date().toISOString(),stats,history,bookmarks},null,2);const blob=new Blob([payload],{type:'application/json;charset=utf-8'});const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download='irish-theory-br-progresso.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1500)}
function resetProgress(){if(!confirm('Apagar todo o histórico, erros pendentes e favoritos deste navegador? Esta ação não pode ser desfeita.'))return;stats={};history=[];bookmarks=[];session=null;save();showHistory()}
function showSources(){root(`<section class="panel" style="max-width:920px;margin:25px auto"><div class="row"><div><h1>Fontes e metodologia</h1><p class="sub">Questões de estudo originais, com referência e explicação em português.</p></div><button class="btn soft small" onclick="home()">← Voltar</button></div><div class="notice warning"><strong>Importante:</strong> estas ${BANK.length} questões não são cópias do banco oficial de perguntas da RSA. Esta versão é uma beta funcional independente; não substitui os materiais oficiais. Algumas questões são recomendações de segurança, não artigos de lei apresentados literalmente.</div><h2 class="section-title" style="margin-top:24px">Referências consultadas</h2><div class="sources-grid">${Object.entries(SOURCES).map(([key,x])=>`<a class="source-tile" href="${safe(x[1])}" target="_blank" rel="noopener noreferrer"><strong>${safe(x[0])} ↗</strong><small>${safe(new URL(x[1]).hostname)}</small></a>`).join('')}</div><h2 class="section-title" style="margin-top:25px">Como interpretar seu desempenho</h2><p class="sub">O simulado reproduz o número de perguntas, o tempo e a nota de aprovação do exame BW. O conjunto de questões é próprio e não reproduz a composição ou a dificuldade exata do banco oficial. As perguntas são selecionadas de forma distribuída pelos assuntos disponíveis. Seu progresso permanece no navegador; faça exportação antes de limpar dados.</p></section>`)}
function speak(lang){if(!('speechSynthesis' in window)){alert('Este navegador não oferece leitura de texto por voz.');return}const q=questionById[session.items[session.pos].id];speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(lang==='pt'?q.pt:q.en);utterance.lang=lang==='pt'?'pt-BR':'en-IE';utterance.rate=.92;speechSynthesis.speak(utterance)}
$('navHome').addEventListener('click',home);$('navHistory').addEventListener('click',showHistory);
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
if(!BANK.length||BANK.some(q=>q.options.length!==4||q.options.some(o=>!o.pt||!o.en))){root('<section class="panel"><h1>Erro nos dados</h1><p>O banco de perguntas não foi carregado corretamente.</p></section>')}else home();
</script>
</body></html>
